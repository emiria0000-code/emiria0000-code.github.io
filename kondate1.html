<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1週間献立マネージャー | 失敗しない詳細数値版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');
        body { font-family: 'Noto+Sans+JP', sans-serif; background-color: #f1f5f9; }
        .tab-active { border-bottom: 4px solid #ef4444; color: #ef4444; font-weight: bold; background-color: white; }
        .step-checked { text-decoration: line-through; opacity: 0.5; background-color: #f9fafb; }
        .gs-badge { background-color: #008931; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; }
        .super-badge { background-color: #3b82f6; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; }
        .beginner-tip { background-color: #fff7ed; border-left: 4px solid #f97316; }
    </style>
</head>
<body class="pb-24">

    <header class="bg-red-500 text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold"><i class="fas fa-utensils mr-2"></i>失敗しない！献立マネージャー</h1>
            <span class="text-[10px] bg-white text-red-500 px-2 py-1 rounded-full font-bold">レンジは全て600W</span>
        </div>
    </header>

    <nav class="bg-white sticky top-[60px] z-40 shadow-sm overflow-x-auto">
        <div class="flex whitespace-nowrap px-2">
            <button onclick="switchDay('mon')" id="tab-mon" class="flex-1 py-3 px-4 text-sm tab-active">月</button>
            <button onclick="switchDay('tue')" id="tab-tue" class="flex-1 py-3 px-4 text-sm text-gray-500">火</button>
            <button onclick="switchDay('wed')" id="tab-wed" class="flex-1 py-3 px-4 text-sm text-gray-500">水</button>
            <button onclick="switchDay('thu')" id="tab-thu" class="flex-1 py-3 px-4 text-sm text-gray-500">木</button>
            <button onclick="switchDay('fri')" id="tab-fri" class="flex-1 py-3 px-4 text-sm text-gray-500">金</button>
            <button onclick="switchDay('sat')" id="tab-sat" class="flex-1 py-3 px-4 text-sm text-gray-500">土</button>
            <button onclick="switchDay('sun')" id="tab-sun" class="flex-1 py-3 px-4 text-sm text-gray-500">日</button>
        </div>
    </nav>

    <main class="max-w-md mx-auto p-4 space-y-6" id="recipe-content">
        <!-- JSで挿入 -->
    </main>

    <script>
        const recipes = {
            mon: {
                title: "月曜日：鶏もも肉のプルコギ炒め（5品）",
                ingredients: [
                    { name: "鶏もも肉", amount: "500g (2枚分)", source: "gs" },
                    { name: "冷凍きざみたまねぎ", amount: "150g (1/3袋)", source: "gs" },
                    { name: "プルコギのたれ", amount: "大さじ6 (90ml)", source: "gs" },
                    { name: "ほうれん草", amount: "100g (ふた掴み)", source: "gs" },
                    { name: "ポテトサラダ", amount: "200g (盛り付けるだけ)", source: "gs" },
                    { name: "千切りキャベツ", amount: "ふたつかみ", source: "super" },
                    { name: "プチトマト", amount: "4個", source: "super" },
                    { name: "豆腐", amount: "1パック", source: "super" }
                ],
                items: [
                    { category: "主菜", name: "鶏プルコギ", steps: ["鶏肉をキッチンバサミで3cm角に切る", "フライパンに油をひかず、凍ったままの『きざみたまねぎ』を強火で3分炒め、水分を飛ばす", "鶏肉を入れ、中火で5分、焼き色がつくまで炒める", "プルコギのたれ大さじ6(90ml)を入れ、強火で1分絡めて完成"] },
                    { category: "汁物", name: "ほうれん草スープ", steps: ["鍋に水600mlとコンソメ小さじ2を入れて沸騰させる", "凍ったままのほうれん草を入れ、中火で1分煮る"] },
                    { category: "副菜1", name: "冷奴", steps: ["豆腐1パックを4つに切り、かつお節と醤油をかける"] },
                    { category: "副菜2", name: "ポテサラ", steps: ["業スーのポテトサラダ200gをお皿に盛るだけ！"] },
                    { category: "サラダ", name: "基本のサラダ", steps: ["千切りキャベツを器に盛り、洗ったプチトマトを添える"] }
                ]
            },
            tue: {
                title: "火曜日：魚と揚げなすのポン酢蒸し（5品）",
                ingredients: [
                    { name: "白身魚フィレ", amount: "4枚", source: "gs" },
                    { name: "冷凍揚げなす", amount: "100g (1/5袋)", source: "gs" },
                    { name: "冷凍ほうれん草", amount: "100g", source: "gs" },
                    { name: "冷凍かぼちゃ", amount: "200g (4〜5切)", source: "gs" },
                    { name: "千切りキャベツ", amount: "ふたつかみ", source: "super" },
                    { name: "プチトマト", amount: "4個", source: "super" }
                ],
                items: [
                    { category: "主菜", name: "白身魚のポン酢蒸し", steps: ["耐熱皿に凍ったままの魚と揚げなすを並べる", "料理酒 大さじ1を全体に振る", "ふんわりラップをしてレンジ(600W)で6分加熱", "ポン酢を適量かけて完成"] },
                    { category: "汁物", name: "基本のわかめ味噌汁", steps: ["鍋に水600mlとだしの素 小さじ1を入れ中火で沸かす", "乾燥わかめをふたつかみ入れる", "【重要】一度火を止めてから、味噌 大さじ2を溶かす", "再度弱火をつけ、フツフツしたらすぐ火を止める"] },
                    { category: "副菜1", name: "かぼちゃの甘煮", steps: ["耐熱容器に凍ったかぼちゃ、水 大さじ2、めんつゆ(3倍濃縮) 大さじ2を入れる", "ラップをしてレンジ(600W)で5分加熱する"] },
                    { category: "副菜2", name: "ほうれん草ソテー", steps: ["フライパンにバター10gを溶かし、凍ったほうれん草を強火で2分炒める", "塩コショウ少々で味を整える"] },
                    { category: "サラダ", name: "基本のサラダ", steps: ["千切りキャベツをお皿に盛り、プチトマトを添える"] }
                ]
            },
            wed: {
                title: "水曜日：豚バラとブロッコリー炒め（5品）",
                ingredients: [
                    { name: "豚バラ肉スライス", amount: "300g", source: "gs" },
                    { name: "冷凍ブロッコリー", amount: "200g (1/2袋)", source: "gs" },
                    { name: "冷凍きざみたまねぎ", amount: "100g", source: "gs" },
                    { name: "ポテトサラダ", amount: "200g", source: "gs" },
                    { name: "卵", amount: "4個", source: "super" },
                    { name: "千切りキャベツ", amount: "ふたつかみ", source: "super" }
                ],
                items: [
                    { category: "主菜", name: "豚バラスタミナ炒め", steps: ["フライパンで豚肉を炒め、色が変わったら『きざみたまねぎ』を入れる", "凍ったままのブロッコリーを入れ、蓋をして弱火で2分蒸し焼きにする", "焼肉のたれ 大さじ4を入れ、強火で30秒炒め合わせる"] },
                    { category: "副菜1", name: "厚焼き玉子", steps: ["卵3個、白だし 小さじ1、水 大さじ1を混ぜて焼く"] },
                    { category: "副菜2", name: "ポテサラ", steps: ["業スーのポテトサラダをお皿に盛るだけ"] },
                    { category: "汁物", name: "たまごスープ", steps: ["鍋に水600ml、コンソメ 小さじ2、きざみたまねぎ少々を沸かす", "溶き卵1個を円を描くように入れ、すぐ火を止める"] },
                    { category: "サラダ", name: "基本のサラダ", steps: ["千切りキャベツをお皿に盛り、プチトマトを添える"] }
                ]
            },
            thu: {
                title: "木曜日：肉だんごの甘酢和え（5品）",
                ingredients: [
                    { name: "冷凍肉だんご", amount: "20個", source: "gs" },
                    { name: "冷凍揚げなす", amount: "100g", source: "gs" },
                    { name: "冷凍ブロッコリー", amount: "100g", source: "gs" },
                    { name: "冷凍かぼちゃ", amount: "100g", source: "gs" },
                    { name: "豆腐", amount: "1パック", source: "super" }
                ],
                items: [
                    { category: "主菜", name: "甘酢肉だんご", steps: ["フライパンに凍ったままの肉だんごと揚げなすを入れる", "ケチャップ・醤油・酢・砂糖を各 大さじ2ずつ入れる", "中火で加熱し、タレがブクブクしてトロみがつくまで3分混ぜる"] },
                    { category: "汁物", name: "豆腐の味噌汁", steps: ["鍋に水600ml、だしの素 小さじ1を入れ沸騰させる", "1cm角に切った豆腐を入れ1分煮る", "火を止め、味噌 大さじ2を溶かし入れる"] },
                    { category: "副菜1", name: "ブロッコリーのごま和え", steps: ["冷凍ブロッコリー100gをレンジ(600W)で2分加熱", "すりごま・砂糖・醤油を各 小さじ1ずつ混ぜて和える"] },
                    { category: "副菜2", name: "かぼちゃのバニラ煮", steps: ["冷凍かぼちゃ100gに砂糖 大さじ1と水少々をかけ、ラップしてレンジ(600W)で3分"] },
                    { category: "サラダ", name: "基本のサラダ", steps: ["千切りキャベツとプチトマトをお皿に盛る"] }
                ]
            },
            fri: {
                title: "金曜日：鮭のちゃんちゃん焼き風（5品）",
                ingredients: [
                    { name: "冷凍銀鮭切身", amount: "4枚", source: "gs" },
                    { name: "冷凍きざみたまねぎ", amount: "100g", source: "gs" },
                    { name: "冷凍かぼちゃ", amount: "200g", source: "gs" },
                    { name: "豆腐", amount: "1丁", source: "super" },
                    { name: "卵", amount: "1個", source: "super" }
                ],
                items: [
                    { category: "主菜", name: "鮭の味噌バター焼き", steps: ["フライパンに鮭と凍ったたまねぎを並べ、酒 大さじ1をふる", "蓋をして中火で4分蒸し焼きにする", "混ぜた味噌だれ(味噌大2,みりん大1,砂糖小1)を鮭に塗り、バター10gを落とす", "蓋なし強火で1分、香ばしく焼く"] },
                    { category: "副菜1", name: "かぼちゃのサラダ", steps: ["レンジで5分加熱したかぼちゃ200gをフォークで潰す", "マヨネーズ 大さじ2で和える"] },
                    { category: "副菜2", name: "豆腐の卵とじ", steps: ["耐熱容器に豆腐、めんつゆ 大さじ1、溶き卵を入れる", "ラップをせずレンジ(600W)で3分加熱する"] },
                    { category: "汁物", name: "ほうれん草の味噌汁", steps: ["鍋に水600ml、だしの素 小さじ1、冷凍ほうれん草を入れ沸かす", "火を止めて味噌 大さじ2を溶かす"] },
                    { category: "サラダ", name: "基本のサラダ", steps: ["キャベツとトマトを盛り付ける"] }
                ]
            },
            sat: {
                title: "土曜日：彩り3色ミンチ丼（5品）",
                ingredients: [
                    { name: "合挽ミンチ", amount: "400g", source: "gs" },
                    { name: "冷凍ほうれん草", amount: "150g", source: "gs" },
                    { name: "ポテトサラダ", amount: "200g", source: "gs" },
                    { name: "卵", amount: "2個", source: "super" },
                    { name: "ピザ用チーズ", amount: "適量", source: "super" }
                ],
                items: [
                    { category: "主食", name: "3色そぼろ丼", steps: ["フライパンでミンチを炒め、醤油・砂糖 各 大さじ3で味付けし皿に取る", "同じフライパンで卵2個（砂糖 小さじ1混ぜる）を炒り卵にする", "ほうれん草を凍ったまま炒め、醤油 小さじ1で味付けする", "ご飯の上に3色きれいに並べる"] },
                    { category: "汁物", name: "余り野菜スープ", steps: ["鍋に水600ml、コンソメ 小さじ2を沸かす", "残っている野菜（たまねぎ、ブロッコリー等）を全部入れ3分煮る"] },
                    { category: "副菜1", name: "ポテサラのチーズ焼き", steps: ["耐熱皿にポテサラを盛り、チーズをのせる", "トースターで5分、焼き色がつくまで焼く"] },
                    { category: "副菜2", name: "冷奴", steps: ["豆腐にかつお節と醤油をかける"] },
                    { category: "サラダ", name: "基本のサラダ", steps: ["キャベツとトマトを盛り付ける"] }
                ]
            },
            sun: {
                title: "日曜日：鶏もも肉のカレー（4品）",
                ingredients: [
                    { name: "鶏もも肉", amount: "500g", source: "gs" },
                    { name: "冷凍きざみたまねぎ", amount: "残量全部", source: "gs" },
                    { name: "冷凍ブロッコリー", amount: "100g", source: "gs" },
                    { name: "冷凍揚げなす", amount: "100g", source: "gs" }
                ],
                items: [
                    { category: "主菜", name: "一掃カレー", steps: ["鍋に油 大さじ1をひき、鶏肉とたまねぎを強火で5分炒める", "規定量の水を入れ沸騰させ、アクを取る", "火を止めてルーを溶かし、弱火で5分煮込む"] },
                    { category: "副菜1", name: "ブロッコリーチーズ", steps: ["解凍したブロッコリーにチーズをのせトースターで3分焼く"] },
                    { category: "副菜2", name: "揚げなすのお浸し", steps: ["レンジで2分温めた揚げなすに、めんつゆをかける"] },
                    { category: "サラダ", name: "一掃サラダ", steps: ["残ったキャベツとプチトマトを全部盛り付ける"] }
                ]
            }
        };

        function switchDay(day) {
            document.querySelectorAll('nav button').forEach(btn => {
                btn.classList.remove('tab-active');
                btn.classList.add('text-gray-500');
            });
            document.getElementById(`tab-${day}`).classList.add('tab-active');
            document.getElementById(`tab-${day}`).classList.remove('text-gray-500');
            renderRecipe(day);
        }

        function renderRecipe(day) {
            const data = recipes[day];
            const container = document.getElementById('recipe-content');
            
            let html = `
                <div class="mb-2">
                    <h2 class="text-xl font-bold text-slate-800">${data.title}</h2>
                    <div class="beginner-tip p-3 rounded-lg text-xs mt-3 text-orange-800">
                        <i class="fas fa-lightbulb mr-1"></i> <strong>初心者の方へ：</strong> レンジ加熱はすべて<strong>600W</strong>の設定です。500Wの場合は時間を<strong>1.2倍</strong>にしてください。
                    </div>
                </div>

                <!-- 🛒 食材準備セクション -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="bg-slate-50 px-4 py-2 border-b flex justify-between items-center">
                        <span class="font-bold text-xs text-slate-600"><i class="fas fa-shopping-basket mr-1"></i> 冷蔵庫から出すもの</span>
                    </div>
                    <div class="p-3 grid grid-cols-1 gap-2">
                        ${data.ingredients.map(ing => `
                            <div class="flex items-center justify-between text-sm">
                                <div class="flex items-center gap-2">
                                    <span class="${ing.source === 'gs' ? 'gs-badge' : 'super-badge'}">${ing.source === 'gs' ? '業スー' : 'スーパー'}</span>
                                    <span class="font-medium text-slate-700">${ing.name}</span>
                                </div>
                                <span class="text-slate-500 text-xs">${ing.amount}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            
            data.items.forEach((item) => {
                html += `
                    <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-slate-200">
                        <div class="bg-red-50 p-3 border-b border-red-100 flex justify-between items-center">
                            <h3 class="font-bold text-slate-800 text-sm"><span class="bg-red-500 text-white text-[10px] px-2 py-0.5 rounded mr-2">${item.category}</span> ${item.name}</h3>
                        </div>
                        <div class="p-4">
                            <ul class="space-y-4">
                                ${item.steps.map((step) => `
                                    <li class="flex items-start gap-3 cursor-pointer group p-1 rounded" onclick="this.classList.toggle('step-checked')">
                                        <div class="mt-0.5 w-5 h-5 rounded-md border-2 border-slate-300 flex-shrink-0 flex items-center justify-center transition-colors">
                                            <i class="fas fa-check text-[10px] text-transparent group-[.step-checked]:text-red-500"></i>
                                        </div>
                                        <span class="text-sm text-slate-700 leading-relaxed">${step}</span>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onload = () => switchDay('mon');
    </script>
</body>
</html>
